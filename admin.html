<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
Cezonal Careers Admin
</title>


<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    min-height:100vh;

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:#f6f7f8;

    color:#111827;
}


button,
input,
textarea{

    font:inherit;

}


button{

    cursor:pointer;

}


.hidden{

    display:none !important;

}



/* HEADER */

.header{

    height:70px;

    display:flex;

    align-items:center;

    border-bottom:
        1px solid #e5e7eb;

    background:#fff;

}


.header-inner{

    width:100%;

    max-width:1400px;

    margin:auto;

    padding:0 24px;

    display:flex;

    align-items:center;

    justify-content:
        space-between;

}


.brand h1{

    font-size:17px;

}


.brand p{

    margin-top:3px;

    color:#9ca3af;

    font-size:9px;

    letter-spacing:1.5px;

}


.logout{

    padding:
        9px 13px;

    border:
        1px solid #e5e7eb;

    border-radius:9px;

    background:#fff;

}



/* LOGIN */

.login-page{

    min-height:
        calc(
            100vh - 70px
        );

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


.login-card{

    width:100%;

    max-width:420px;

    padding:28px;

    background:#fff;

    border:
        1px solid #e5e7eb;

    border-radius:18px;

}


.login-card h2{

    font-size:25px;

}


.login-card p{

    margin-top:8px;

    color:#6b7280;

    font-size:13px;

    line-height:1.6;

}


.label{

    display:block;

    margin:
        20px 0 8px;

    font-size:12px;

    font-weight:700;

}


.input{

    width:100%;

    height:50px;

    padding:0 14px;

    border:
        1px solid #d9dde3;

    border-radius:10px;

    outline:none;

}


.btn{

    width:100%;

    height:50px;

    margin-top:12px;

    border:none;

    border-radius:10px;

    background:#111827;

    color:#fff;

    font-weight:700;

}


.otp-section{

    display:none;

    margin-top:18px;

    padding-top:18px;

    border-top:
        1px solid #eee;

}


.otp-section.show{

    display:block;

}


.otp{

    text-align:center;

    letter-spacing:10px;

    font-size:22px;

    font-weight:700;

}



/* DASHBOARD */

.dashboard{

    display:none;

    width:100%;

    max-width:1400px;

    margin:auto;

    padding:
        30px 24px 60px;

}


.dashboard.show{

    display:block;

}


.dashboard-head{

    margin-bottom:25px;

}


.dashboard-head h2{

    font-size:31px;

}


.dashboard-head p{

    margin-top:7px;

    color:#6b7280;

}



/* STATS */

.stats{

    display:grid;

    grid-template-columns:
        repeat(
            4,
            1fr
        );

    gap:14px;

    margin-bottom:22px;

}


.stat{

    padding:18px;

    border:
        1px solid #e5e7eb;

    border-radius:13px;

    background:#fff;

}


.stat span{

    font-size:10px;

    color:#8b919a;

    text-transform:uppercase;

}


.stat strong{

    display:block;

    margin-top:8px;

    font-size:28px;

}



/* TABLE */

.table-card{

    overflow:auto;

    border:
        1px solid #e5e7eb;

    border-radius:13px;

    background:#fff;

}


table{

    width:100%;

    min-width:900px;

    border-collapse:
        collapse;

}


th{

    padding:13px;

    text-align:left;

    background:#fafafa;

    color:#8b919a;

    font-size:10px;

}


td{

    padding:14px;

    border-top:
        1px solid #eee;

    font-size:12px;

}


.status{

    padding:
        6px 9px;

    border-radius:
        100px;

    font-size:9px;

    font-weight:700;

}


.pending{

    background:#fff8e6;

    color:#9a6700;

}


.accepted{

    background:#eff8f3;

    color:#18794e;

}


.rejected{

    background:#fff4f2;

    color:#b42318;

}


.view{

    padding:
        8px 10px;

    border:
        1px solid #ddd;

    border-radius:8px;

    background:#fff;

}



/* MODAL */

.modal-overlay{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:
        rgba(
            0,
            0,
            0,
            .4
        );

}


.modal-overlay.show{

    display:flex;

}


.modal{

    width:100%;

    max-width:600px;

    max-height:90vh;

    overflow:auto;

    padding:26px;

    border-radius:18px;

    background:#fff;

}


.modal h3{

    font-size:25px;

}


.details{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

    margin-top:20px;

}


.detail{

    padding:13px;

    background:#fafafa;

    border:
        1px solid #eee;

    border-radius:10px;

}


.detail small{

    color:#8b919a;

    font-size:9px;

}


.detail div{

    margin-top:6px;

    font-size:12px;

}


.full{

    grid-column:
        1 / -1;

}


.actions{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:10px;

    margin-top:20px;

}


.accept{

    height:48px;

    border:none;

    border-radius:10px;

    background:#111827;

    color:#fff;

    font-weight:700;

}


.reject{

    height:48px;

    border:
        1px solid #efc4bf;

    border-radius:10px;

    background:#fff;

    color:#b42318;

    font-weight:700;

}


.close{

    width:100%;

    height:44px;

    margin-top:10px;

    border:
        1px solid #ddd;

    border-radius:9px;

    background:#fff;

}


@media(
    max-width:700px
){

    .stats{

        grid-template-columns:
            1fr 1fr;

    }


    .details{

        grid-template-columns:
            1fr;

    }


    .full{

        grid-column:auto;

    }


    .actions{

        grid-template-columns:
            1fr;

    }

}

</style>

</head>


<body>


<header class="header">

<div class="header-inner">

<div class="brand">

<h1>
Cezonal Careers Admin
</h1>

<p>
CEZONAL SOLUTIONS PRIVATE LIMITED
</p>

</div>


<button
id="logoutBtn"
class="logout hidden"
>

Sign out

</button>

</div>

</header>



<section
id="loginPage"
class="login-page"
>

<div class="login-card">

<h2>
Admin Login
</h2>

<p>
Only authorized careers administrators can access applications.
</p>


<label
class="label"
>

Admin Email

</label>


<input
id="adminEmail"
class="input"
type="email"
placeholder="admin@gmail.com"
>


<button
id="sendOtpBtn"
class="btn"
>

Send OTP

</button>


<div
id="otpSection"
class="otp-section"
>

<label
class="label"
>

Enter OTP

</label>


<input
id="otpInput"
class="input otp"
maxlength="6"
inputmode="numeric"
>


<button
id="verifyBtn"
class="btn"
>

Verify & Login

</button>

</div>

</div>

</section>



<main
id="dashboard"
class="dashboard"
>

<div class="dashboard-head">

<h2>
Applications
</h2>

<p>
Review submitted applications.
</p>

</div>


<section class="stats">

<div class="stat">

<span>Total</span>

<strong id="total">
0
</strong>

</div>


<div class="stat">

<span>Pending</span>

<strong id="pending">
0
</strong>

</div>


<div class="stat">

<span>Accepted</span>

<strong id="accepted">
0
</strong>

</div>


<div class="stat">

<span>Rejected</span>

<strong id="rejected">
0
</strong>

</div>

</section>



<div class="table-card">

<table>

<thead>

<tr>

<th>
Applicant
</th>

<th>
Role
</th>

<th>
Phone
</th>

<th>
Date
</th>

<th>
Status
</th>

<th>
Action
</th>

</tr>

</thead>


<tbody id="applicationRows">

</tbody>

</table>

</div>

</main>



<div
id="modalOverlay"
class="modal-overlay"
>

<div class="modal">

<h3 id="modalName">
Applicant
</h3>


<div
id="details"
class="details"
>
</div>


<div class="actions">

<button
id="acceptBtn"
class="accept"
>

Accept Application

</button>


<button
id="rejectBtn"
class="reject"
>

Reject Application

</button>

</div>


<button
id="closeBtn"
class="close"
>

Close

</button>

</div>

</div>



<script>


const SUPABASE_URL =
"https://yezfrkciwosyyookyogs.supabase.co";


const SUPABASE_ANON_KEY =
"sb_publishable_v97iTR8ILzJ_K0X1vmeYiA_SrZcsd57";


const supabaseClient =
window.supabase.createClient(

SUPABASE_URL,

SUPABASE_ANON_KEY

);


let applications = [];

let selectedApplication = null;



const loginPage =
document.getElementById(
"loginPage"
);


const dashboard =
document.getElementById(
"dashboard"
);


const adminEmail =
document.getElementById(
"adminEmail"
);


const otpSection =
document.getElementById(
"otpSection"
);


const otpInput =
document.getElementById(
"otpInput"
);


const sendOtpBtn =
document.getElementById(
"sendOtpBtn"
);


const verifyBtn =
document.getElementById(
"verifyBtn"
);



async function sendOTP(){

const email =
adminEmail
.value
.trim()
.toLowerCase();


if(!email){

alert(
"Enter admin email"
);

return;

}


const {
error
} =
await supabaseClient
.auth
.signInWithOtp({

email,

options:{

shouldCreateUser:false

}

});


if(error){

alert(
error.message
);

return;

}


otpSection
.classList
.add(
"show"
);


}


async function verifyOTP(){

const email =
adminEmail
.value
.trim()
.toLowerCase();


const token =
otpInput
.value
.trim();


const {
data,
error
} =
await supabaseClient
.auth
.verifyOtp({

email,

token,

type:"email"

});


if(error){

alert(
error.message
);

return;

}


const allowed =
await checkAdmin();


if(!allowed){

await supabaseClient
.auth
.signOut();


alert(
"Not authorized as admin."
);


return;

}


openDashboard();

}



async function checkAdmin(){

const {
data:{
user
}
} =
await supabaseClient
.auth
.getUser();


if(!user){

return false;

}


const {
data
} =
await supabaseClient
.from(
"career_admins"
)
.select("*")
.eq(
"user_id",
user.id
)
.eq(
"is_active",
true
)
.maybeSingle();


return !!data;

}



async function openDashboard(){

loginPage.style.display =
"none";


dashboard.classList.add(
"show"
);


document
.getElementById(
"logoutBtn"
)
.classList
.remove(
"hidden"
);


loadApplications();

}



async function loadApplications(){

const {
data,
error
} =
await supabaseClient
.from(
"career_applications"
)
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

console.error(
error
);

return;

}


applications =
data || [];


renderApplications();

renderStats();

}



function getStatus(
application
){

return (

application.review_status

||

"pending"

).toLowerCase();

}



function renderStats(){

document
.getElementById(
"total"
)
.textContent =
applications.length;


document
.getElementById(
"pending"
)
.textContent =
applications
.filter(
a =>
getStatus(a) ===
"pending"
)
.length;


document
.getElementById(
"accepted"
)
.textContent =
applications
.filter(
a =>
getStatus(a) ===
"accepted"
)
.length;


document
.getElementById(
"rejected"
)
.textContent =
applications
.filter(
a =>
getStatus(a) ===
"rejected"
)
.length;

}



function renderApplications(){

const tbody =
document.getElementById(
"applicationRows"
);


tbody.innerHTML =
applications
.map(
app => {

const status =
getStatus(
app
);


return `

<tr>

<td>

<strong>
${escapeHTML(
app.full_name
)}
</strong>

<br>

<small>
${escapeHTML(
app.email
)}
</small>

</td>


<td>

${escapeHTML(
app.job_role
)}

</td>


<td>

${escapeHTML(
app.phone
)}

</td>


<td>

${new Date(
app.created_at
)
.toLocaleString()}

</td>


<td>

<span
class="status ${status}"
>

${status}

</span>

</td>


<td>

<button
class="view"
onclick="openApplication(${app.id})"
>

View Details

</button>

</td>

</tr>

`;

}
)
.join("");

}



window.openApplication =
function(id){

selectedApplication =
applications
.find(
a =>
Number(a.id) ===
Number(id)
);


if(!selectedApplication){

return;

}


document
.getElementById(
"modalName"
)
.textContent =
selectedApplication
.full_name;


document
.getElementById(
"details"
)
.innerHTML = `

<div class="detail">

<small>
Email
</small>

<div>
${escapeHTML(
selectedApplication.email
)}
</div>

</div>


<div class="detail">

<small>
Phone
</small>

<div>
${escapeHTML(
selectedApplication.phone
)}
</div>

</div>


<div class="detail">

<small>
Job Role
</small>

<div>
${escapeHTML(
selectedApplication.job_role
)}
</div>

</div>


<div class="detail">

<small>
Location
</small>

<div>
${escapeHTML(
selectedApplication.location
||
"-"
)}
</div>

</div>


<div class="detail">

<small>
Experience
</small>

<div>
${escapeHTML(
selectedApplication.experience
||
"-"
)}
</div>

</div>


<div class="detail">

<small>
Qualification
</small>

<div>
${escapeHTML(
selectedApplication.qualification
||
"-"
)}
</div>

</div>


<div class="detail full">

<small>
Portfolio
</small>

<div>
${escapeHTML(
selectedApplication.portfolio_url
||
"-"
)}
</div>

</div>


<div class="detail full">

<small>
Message
</small>

<div>
${escapeHTML(
selectedApplication.cover_message
||
"-"
)}
</div>

</div>

`;


document
.getElementById(
"modalOverlay"
)
.classList
.add(
"show"
);

};



async function decision(
action
){

if(
!selectedApplication
){

return;

}


const {
data,
error
} =
await supabaseClient
.functions
.invoke(

"admin-application-action",

{

body:{

applicationId:
selectedApplication.id,

action:
action

}

}

);


if(error){

alert(
error.message
);

return;

}


alert(
data.message
);


document
.getElementById(
"modalOverlay"
)
.classList
.remove(
"show"
);


loadApplications();

}



document
.getElementById(
"acceptBtn"
)
.onclick =
() =>
decision(
"accept"
);


document
.getElementById(
"rejectBtn"
)
.onclick =
() =>
decision(
"reject"
);


document
.getElementById(
"closeBtn"
)
.onclick =
() => {

document
.getElementById(
"modalOverlay"
)
.classList
.remove(
"show"
);

};


sendOtpBtn
.onclick =
sendOTP;


verifyBtn
.onclick =
verifyOTP;


document
.getElementById(
"logoutBtn"
)
.onclick =
async () => {

await supabaseClient
.auth
.signOut();


location.reload();

};



function escapeHTML(
value
){

return String(
value ?? ""
)

.replaceAll(
"&",
"&amp;"
)

.replaceAll(
"<",
"&lt;"
)

.replaceAll(
">",
"&gt;"
)

.replaceAll(
'"',
"&quot;"
)

.replaceAll(
"'",
"&#039;"
);

}



async function restore(){

const {
data:{
session
}
} =
await supabaseClient
.auth
.getSession();


if(!session){

return;

}


const allowed =
await checkAdmin();


if(allowed){

openDashboard();

}

}


restore();


</script>

</body>

</html>
