<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Examinations Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:#ffffff;
    font-family:Inter,Arial,Helvetica,sans-serif;
    color:#202124;
}

.authWrap{
    width:100%;
    max-width:400px;
}

.topBack{
    display:none;
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    border-radius:50%;
    cursor:pointer;
    margin-bottom:24px;
    font-size:25px;
    line-height:38px;
    text-align:center;
    color:#3c4043;
}

.topBack:hover{
    background:#f1f3f4;
}

.title{
    font-size:28px;
    font-weight:600;
    letter-spacing:-.4px;
    color:#202124;
    margin-bottom:10px;
}

.subtitle{
    font-size:14px;
    line-height:1.55;
    color:#5f6368;
    margin-bottom:32px;
}

.fieldLabel{
    display:block;
    font-size:13px;
    font-weight:500;
    color:#3c4043;
    margin-bottom:9px;
}

.textInput{
    width:100%;
    height:50px;
    padding:0 2px;
    border:0;
    border-bottom:1.5px solid #dadce0;
    border-radius:0;
    outline:none;
    background:transparent;
    font-size:16px;
    color:#202124;
    transition:.2s ease;
}

.textInput:focus{
    border-bottom-color:#1a73e8;
}

.primaryBtn{
    width:100%;
    height:50px;
    margin-top:24px;
    border:0;
    border-radius:25px;
    background:#1a73e8;
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.2s ease;
}

.primaryBtn:hover{
    background:#1765cc;
}

.primaryBtn:disabled,
.googleBtn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.divider{
    display:flex;
    align-items:center;
    gap:14px;
    margin:28px 0;
    color:#9aa0a6;
    font-size:11px;
    font-weight:600;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#eeeeee;
}

.googleBtn{
    width:100%;
    height:52px;
    border:1px solid #dadce0;
    border-radius:26px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    color:#3c4043;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.2s ease;
}

.googleBtn:hover{
    background:#f8f9fa;
}

.googleBtn svg{
    width:20px;
    height:20px;
}

#otpStep{
    display:none;
}

.codeInput{
    width:100%;
    height:56px;
    padding:0 2px;
    border:0;
    border-bottom:2px solid #dadce0;
    border-radius:0;
    background:transparent;
    outline:none;
    font-size:27px;
    font-weight:600;
    letter-spacing:10px;
    color:#202124;
    transition:.2s ease;
}

.codeInput:focus{
    border-bottom-color:#1a73e8;
}

.helperText{
    margin-top:12px;
    color:#5f6368;
    font-size:13px;
    line-height:1.5;
}

.resendBtn{
    display:block;
    margin:20px auto 0;
    border:0;
    background:transparent;
    color:#1a73e8;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

.resendBtn:disabled{
    color:#9aa0a6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:18px;
    font-size:13px;
    line-height:1.5;
}

.message.success{
    display:block;
    color:#188038;
}

.message.error{
    display:block;
    color:#d93025;
}

.userBox{
    display:none;
    text-align:center;
}

.avatar{
    width:74px;
    height:74px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:14px;
}

.userName{
    font-size:20px;
    font-weight:600;
}

.userEmail{
    margin-top:6px;
    color:#5f6368;
    font-size:14px;
}

.logoutBtn{
    width:100%;
    height:50px;
    margin-top:24px;
    border:1px solid #dadce0;
    border-radius:25px;
    background:#fff;
    color:#3c4043;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

@media(max-width:480px){
    body{
        align-items:flex-start;
        padding:64px 24px 32px;
    }

    .title{
        font-size:26px;
    }
}
</style>
</head>

<body>

<div class="authWrap">

    <button id="backBtn" class="topBack" type="button" aria-label="Back">←</button>

    <div id="loginSection">

        <!-- STEP 1 -->
        <div id="emailStep">

            <div class="title">Sign in</div>

            <div class="subtitle">
                Enter your email to continue to Examinations.
            </div>

            <label class="fieldLabel" for="emailInput">
                Email address
            </label>

            <input
                id="emailInput"
                class="textInput"
                type="email"
                placeholder="example@gmail.com"
                autocomplete="email"
            >

            <button
                id="sendOtpBtn"
                class="primaryBtn"
                type="button"
            >
                Continue
            </button>

            <div class="divider">OR</div>

            <button
                id="googleBtn"
                class="googleBtn"
                type="button"
            >
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.75 3.27-8.1z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.15v2.84A11 11 0 0 0 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.15a11 11 0 0 0 0 9.88l3.69-2.84z"/>
                    <path fill="#EA4335" d="M12 5.37c1.61 0 3.06.55 4.2 1.63l3.15-3.15C17.45 2.08 14.97 1 12 1A11 11 0 0 0 2.15 7.06L5.84 9.9C6.71 7.3 9.14 5.37 12 5.37z"/>
                </svg>

                <span id="googleBtnText">
                    Continue with Google
                </span>
            </button>

        </div>


        <!-- STEP 2 -->
        <div id="otpStep">

            <div class="title">
                Enter verification code
            </div>

            <div class="subtitle">
                Check your email and enter the 6-digit code to continue.
            </div>

            <label class="fieldLabel" for="otpInput">
                Verification code
            </label>

            <input
                id="otpInput"
                class="codeInput"
                type="text"
                inputmode="numeric"
                maxlength="6"
                placeholder="000000"
                autocomplete="one-time-code"
            >

            <div class="helperText">
                Didn't receive the code? You can request a new one below.
            </div>

            <button
                id="verifyOtpBtn"
                class="primaryBtn"
                type="button"
            >
                Continue
            </button>

            <button
                id="resendOtpBtn"
                class="resendBtn"
                type="button"
            >
                Resend code
            </button>

        </div>


        <div
            id="message"
            class="message"
        ></div>

    </div>


    <!-- LOGGED USER -->
    <div
        id="userBox"
        class="userBox"
    >

        <img
            id="userAvatar"
            class="avatar"
            alt="Profile"
        >

        <div
            id="userName"
            class="userName"
        ></div>

        <div
            id="userEmail"
            class="userEmail"
        ></div>

        <button
            id="logoutBtn"
            class="logoutBtn"
            type="button"
        >
            Sign out
        </button>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://fubjzvqiitulczwtfete.supabase.co/";

const SUPABASE_KEY =
    "sb_publishable_gNXDdfiJ1eTFzD49btPN_w_Tl0Re6PJ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );


const loginSection =
    document.getElementById("loginSection");

const emailStep =
    document.getElementById("emailStep");

const otpStep =
    document.getElementById("otpStep");

const backBtn =
    document.getElementById("backBtn");

const emailInput =
    document.getElementById("emailInput");

const sendOtpBtn =
    document.getElementById("sendOtpBtn");

const otpInput =
    document.getElementById("otpInput");

const verifyOtpBtn =
    document.getElementById("verifyOtpBtn");

const resendOtpBtn =
    document.getElementById("resendOtpBtn");

const googleBtn =
    document.getElementById("googleBtn");

const googleBtnText =
    document.getElementById("googleBtnText");

const message =
    document.getElementById("message");

const userBox =
    document.getElementById("userBox");

const logoutBtn =
    document.getElementById("logoutBtn");


let currentEmail = "";

let resendSeconds = 0;

let resendTimer = null;


function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}


function clearMessage(){

    message.textContent = "";

    message.className =
        "message";

}


/* ============================
   STEP SWITCHING
============================ */

function showEmailStep(){

    clearMessage();

    otpStep.style.display =
        "none";

    emailStep.style.display =
        "block";

    backBtn.style.display =
        "none";

    otpInput.value =
        "";

    currentEmail =
        "";

    clearInterval(
        resendTimer
    );

    resendSeconds =
        0;

    resendOtpBtn.disabled =
        false;

    resendOtpBtn.textContent =
        "Resend code";

    emailInput.disabled =
        false;

    emailInput.focus();

}


function showOtpStep(){

    clearMessage();

    emailStep.style.display =
        "none";

    otpStep.style.display =
        "block";

    backBtn.style.display =
        "block";

    otpInput.value =
        "";

    otpInput.focus();

}


backBtn.addEventListener(
    "click",
    showEmailStep
);


/* ============================
   SEND OTP
============================ */

async function sendOtp(email){

    const {
        error
    } =
        await supabaseClient.auth.signInWithOtp({

            email:email,

            options:{

                shouldCreateUser:true

            }

        });


    if(error){

        throw error;

    }

}


sendOtpBtn.addEventListener(
    "click",
    async () =>
    {

        clearMessage();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const validEmail =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


        if(!validEmail.test(email)){

            showMessage(
                "Enter a valid email address.",
                "error"
            );

            return;

        }


        currentEmail =
            email;


        sendOtpBtn.disabled =
            true;


        sendOtpBtn.textContent =
            "Sending...";


        try{

            await sendOtp(
                email
            );


            showOtpStep();


            startResendTimer();

        }
        catch(error){

            console.error(
                "OTP SEND ERROR:",
                error
            );


            showMessage(
                error?.message ||
                "Unable to send verification code.",
                "error"
            );

        }
        finally{

            sendOtpBtn.disabled =
                false;


            sendOtpBtn.textContent =
                "Continue";

        }

    }
);


/* ============================
   OTP INPUT
============================ */

otpInput.addEventListener(
    "input",
    function()
    {

        this.value =
            this.value
                .replace(/\D/g,"")
                .slice(0,6);

    }
);


/* ============================
   VERIFY OTP
============================ */

verifyOtpBtn.addEventListener(
    "click",
    async () =>
    {

        clearMessage();


        const token =
            otpInput.value
                .replace(/\D/g,"");


        if(token.length !== 6){

            showMessage(
                "Enter the complete 6-digit verification code.",
                "error"
            );

            return;

        }


        verifyOtpBtn.disabled =
            true;


        verifyOtpBtn.textContent =
            "Verifying...";


        try{

            const {
                data,
                error
            } =
                await supabaseClient.auth.verifyOtp({

                    email:currentEmail,

                    token:token,

                    type:"email"

                });


            if(error){

                throw error;

            }


            const user =
                data?.session?.user ||
                data?.user;


            if(!user){

                throw new Error(
                    "Authentication session was not created."
                );

            }


            showUser(
                user
            );

        }
        catch(error){

            console.error(
                "OTP VERIFY ERROR:",
                error
            );


            showMessage(
                error?.message ||
                "Verification failed.",
                "error"
            );

        }
        finally{

            verifyOtpBtn.disabled =
                false;


            verifyOtpBtn.textContent =
                "Continue";

        }

    }
);


/* ============================
   RESEND
============================ */

resendOtpBtn.addEventListener(
    "click",
    async () =>
    {

        if(
            !currentEmail ||
            resendSeconds > 0
        ){

            return;

        }


        clearMessage();


        resendOtpBtn.disabled =
            true;


        resendOtpBtn.textContent =
            "Sending...";


        try{

            await sendOtp(
                currentEmail
            );


            otpInput.value =
                "";


            otpInput.focus();


            showMessage(
                "A new verification code was sent.",
                "success"
            );


            startResendTimer();

        }
        catch(error){

            showMessage(
                error?.message ||
                "Unable to resend code.",
                "error"
            );


            resendOtpBtn.disabled =
                false;


            resendOtpBtn.textContent =
                "Resend code";

        }

    }
);


function startResendTimer(){

    clearInterval(
        resendTimer
    );


    resendSeconds =
        60;


    resendOtpBtn.disabled =
        true;


    const updateTimer =
        () =>
        {

            if(resendSeconds <= 0){

                clearInterval(
                    resendTimer
                );


                resendOtpBtn.disabled =
                    false;


                resendOtpBtn.textContent =
                    "Resend code";


                return;

            }


            resendOtpBtn.textContent =
                "Resend code in " +
                resendSeconds +
                "s";


            resendSeconds--;

        };


    updateTimer();


    resendTimer =
        setInterval(
            updateTimer,
            1000
        );

}


/* ============================
   GOOGLE LOGIN
============================ */

googleBtn.addEventListener(
    "click",
    async () =>
    {

        clearMessage();


        googleBtn.disabled =
            true;


        googleBtnText.textContent =
            "Opening Google...";


        try{

            const redirectUrl =
                window.location.origin +
                window.location.pathname;


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithOAuth({

                    provider:"google",

                    options:{

                        redirectTo:redirectUrl,

                        skipBrowserRedirect:false,

                        queryParams:{

                            prompt:"select_account"

                        }

                    }

                });


            if(error){

                throw error;

            }


            if(data?.url){

                window.location.assign(
                    data.url
                );

            }

        }
        catch(error){

            console.error(
                "GOOGLE LOGIN ERROR:",
                error
            );


            googleBtn.disabled =
                false;


            googleBtnText.textContent =
                "Continue with Google";


            showMessage(
                error?.message ||
                "Google authentication failed.",
                "error"
            );

        }

    }
);


/* ============================
   AUTHENTICATED USER
============================ */

function showUser(user){

    if(!user) return;


    loginSection.style.display =
        "none";


    backBtn.style.display =
        "none";


    userBox.style.display =
        "block";


    const metadata =
        user.user_metadata || {};


    document.getElementById(
        "userName"
    ).textContent =
        metadata.full_name ||
        metadata.name ||
        user.email?.split("@")[0] ||
        "User";


    document.getElementById(
        "userEmail"
    ).textContent =
        user.email || "";


    const avatar =
        document.getElementById(
            "userAvatar"
        );


    const avatarUrl =
        metadata.avatar_url ||
        metadata.picture;


    if(avatarUrl){

        avatar.src =
            avatarUrl;


        avatar.style.display =
            "inline-block";

    }
    else{

        avatar.style.display =
            "none";

    }

}


async function restoreSession(){

    const {
        data,
        error
    } =
        await supabaseClient.auth.getSession();


    if(error){

        console.error(
            error
        );

        return;

    }


    if(data?.session?.user){

        showUser(
            data.session.user
        );

    }

}


supabaseClient.auth.onAuthStateChange(
    (event,session) =>
    {

        if(session?.user){

            showUser(
                session.user
            );

        }

    }
);


logoutBtn.addEventListener(
    "click",
    async () =>
    {

        const {
            error
        } =
            await supabaseClient.auth.signOut();


        if(error){

            console.error(
                error
            );

            return;

        }


        window.location.reload();

    }
);


restoreSession();

</script>

</body>
</html>
